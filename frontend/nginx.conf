server {
  listen 80;
  server_name ${APP_DOMAIN};
  return 301 https://${APP_DOMAIN}$request_uri;
}

map $host $app_certificate {
  default /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
}

map $host $app_certificate_key {
  default /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
}

server {
  listen 443 ssl;
  server_name ${APP_DOMAIN};
  client_max_body_size 12m;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate $app_certificate;
  ssl_certificate_key $app_certificate_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;

  location = /api { return 308 /api/; }
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    proxy_pass http://backend:8000/docs;
    proxy_set_header Host $host;
  }
  location = /openapi.json {
    proxy_pass http://backend:8000/openapi.json;
    proxy_set_header Host $host;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location / { try_files $uri $uri/ /index.html; }
}
