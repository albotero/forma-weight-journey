services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracker}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TIMEZONE: ${TIMEZONE:-America/Bogota}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${APP_DOMAIN:-forma.albotero.com}}
      STORAGE_PATH: /data/storage
      COOKIE_DOMAIN: ${APP_DOMAIN:-forma.albotero.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://${APP_DOMAIN:-forma.albotero.com}}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      EMAIL_VERIFICATION_TOKEN_HOURS: ${EMAIL_VERIFICATION_TOKEN_HOURS:-24}
    volumes:
      - ./storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private, egress]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on: [backend]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-forma.albotero.com}
      NGINX_ENVSUBST_FILTER: APP_DOMAIN
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    networks: [private, edge]

  certbot:
    image: certbot/dns-cloudflare:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do certbot renew --quiet --deploy-hook 'chgrp 101 /etc/letsencrypt/archive && chmod 710 /etc/letsencrypt/archive && chgrp 101 /etc/letsencrypt/live && chmod 710 /etc/letsencrypt/live && chgrp 101 $$RENEWED_LINEAGE/privkey.pem && chmod 640 $$RENEWED_LINEAGE/privkey.pem'; sleep 12h; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./secrets/cloudflare.ini:/run/secrets/cloudflare.ini:ro
    networks: [edge]

volumes:
  postgres_data:
  letsencrypt:

networks:
  private:
    internal: true
  egress:
    driver: bridge
  edge:
